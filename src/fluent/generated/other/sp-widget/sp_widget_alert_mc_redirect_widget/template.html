<div class="cb-container">

    <!-- Loading state: shown while API calls are in flight -->
    <div class="cb-loading" ng-if="c.loading">
        <div class="cb-spinner"></div>
        <p class="cb-label">Setting up your wallet&hellip;</p>
    </div>

    <!-- Error state -->
    <div class="cb-error" ng-if="c.error">
        <p>{{c.error}}</p>
        <button ng-click="c.goBack()">Go Back</button>
    </div>

</div>

<style>
    .cb-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
    }
    .cb-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
    }
    .cb-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0,0,0,0.1);
        border-top-color: #555;
        border-radius: 50%;
        animation: cb-spin 0.75s linear infinite;
    }
    @keyframes cb-spin { to { transform: rotate(360deg); } }
    .cb-label {
        font-size: 14px;
        color: #555;
        font-family: "Segoe UI", Arial, sans-serif;
    }
    .cb-error {
        text-align: center;
        color: #c00;
        font-family: "Segoe UI", Arial, sans-serif;
    }
</style>
