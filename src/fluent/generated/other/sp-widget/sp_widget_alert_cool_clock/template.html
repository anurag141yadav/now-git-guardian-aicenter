<div class="time-container text-right">
  <div class="time-box" id="timezone1">
    <h2>Local</h2>
    <div class="time">{{c.localTime}}</div>
    <div class="date">{{c.localDate}}</div>
    <div class="tz">({{c.localTZ}})</div>
  </div>
  <div class="time-box" id="timezone2">
    <h2>{{c.locationName}}</h2>
    <div class="time">{{c.locationTime}}</div>
    <div class="date">{{c.locationDate}}</div>
    <div class="tz">({{c.locationTZ}})</div>
  </div>
</div>
